name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run validate
      - name: Build deterministic plugin archive
        run: |
          git archive --format=tar --prefix=token-razor/ "$GITHUB_SHA" | gzip -n -9 > "token-razor-${GITHUB_REF_NAME}.tar.gz"
          sha256sum "token-razor-${GITHUB_REF_NAME}.tar.gz" > "token-razor-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "token-razor-${GITHUB_REF_NAME}.tar.gz" "token-razor-${GITHUB_REF_NAME}.tar.gz.sha256" --generate-notes --verify-tag
