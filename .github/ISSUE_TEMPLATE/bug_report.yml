name: Bug report
description: Report incorrect compression, hook behavior, or recovery failures.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Token Razor version
      placeholder: 0.3.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps and sanitized output. Never include real secrets.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Diagnostic output
      description: Paste sanitized output from `node scripts/cli.mjs doctor` when relevant.
